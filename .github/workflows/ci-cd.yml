name: ChargeOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Default permissions are intentionally read-only.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

  # -------------------------------------------------
  # Safe CI-only configuration.
  #
  # These are NOT production secrets.
  # -------------------------------------------------

  APP_ENVIRONMENT: test

  OPENAI_API_KEY: ci-test-openai-key-not-real

  JWT_SECRET_KEY: >-
    ci-only-jwt-secret-key-never-use-outside-tests-1234567890-abcdefgh

  JWT_ALGORITHM: HS256
  JWT_ISSUER: chargeops-ai
  JWT_AUDIENCE: chargeops-api

  LANGSMITH_TRACING: "false"

  POSTGRES_DB: chargeops_ci
  POSTGRES_USER: chargeops
  POSTGRES_PASSWORD: chargeops_ci_password

  DATABASE_URL: >-
    postgresql+psycopg://chargeops:chargeops_ci_password@127.0.0.1:5432/chargeops_ci


jobs:

  # =================================================
  # 1. Static quality checks
  # =================================================

  quality:
    name: Quality / Ruff

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Check whitespace errors
        run: |
          git diff --check


  # =================================================
  # 2. Automated test suite
  #
  # Uses the same PostgreSQL + pgvector major
  # version as local ChargeOps.
  # =================================================

  tests:
    name: Tests / PostgreSQL

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: chargeops_ci
          POSTGRES_USER: chargeops
          POSTGRES_PASSWORD: chargeops_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U chargeops -d chargeops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply Alembic migrations
        run: |
          python -m alembic upgrade head

      - name: Show current migration
        run: |
          python -m alembic current

      - name: Run test suite
        run: |
          python -m pytest -q


  # =================================================
  # 3. Docker regression build
  # =================================================

  docker-build:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - quality
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Validate Docker Compose
        run: |
          touch .env
          docker compose config > /dev/null

      - name: Build ChargeOps image
        run: |
          docker build \
            -t chargeops-ai:ci \
            .

      - name: Verify Python runtime
        run: |
          docker run \
            --rm \
            chargeops-ai:ci \
            python --version

      - name: Verify uvx runtime
        run: |
          docker run \
            --rm \
            chargeops-ai:ci \
            uvx --version

      - name: Verify forecasting runtime
        run: |
          docker run \
            --rm \
            chargeops-ai:ci \
            python -c \
            "from app.ml.forecasting.runtime import forecast_station_demand; print('Forecast runtime OK')"

      - name: Verify FastAPI import
        run: |
          docker run \
            --rm \
            -e OPENAI_API_KEY="ci-test-openai-key-not-real" \
            -e DATABASE_URL="postgresql+psycopg://test:test@localhost:5432/test" \
            chargeops-ai:ci \
            python -c \
            "from app.main import app; print(app.title)"


  # =================================================
  # 4. Continuous delivery
  #
  # Only runs for a successful push to main.
  # Pull requests NEVER publish images.
  # =================================================

  publish-image:
    name: Publish / GHCR

    runs-on: ubuntu-latest

    needs:
      - quality
      - tests
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Docker repository names must be lowercase,
      # while the GitHub repository currently contains
      # capital letters in ChargeOps-AI.
      - name: Prepare container image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

          labels: |
            org.opencontainers.image.title=ChargeOps AI
            org.opencontainers.image.description=Agentic EV Charging Intelligence and Operations Platform

      - name: Build and publish ChargeOps image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max